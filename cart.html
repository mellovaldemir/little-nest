<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your cart | ARROW</title><meta name="description" content="ARROW — fun finds for kids and home. Curious everyday picks shipped from US warehouses. Free US shipping on orders over $35.">
<link rel="icon" href="/img/brand/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<div id="site-header"></div>
<main class="wrap">
  <div id="cartArea">
    <div class="carthead"><h1>Your quiver</h1><span style="font-weight:700;color:var(--muted)" id="nitems"></span></div>
    <div class="shipbar" id="shipbar"></div>
    <div class="cartgrid">
      <div id="lines"></div>
      <aside class="summary" id="summary">
        <div class="r"><span>Subtotal</span><span id="sub">$0.00</span></div>
        <div class="r"><span>Shipping</span><span id="ship">—</span></div>
        <div class="r" id="discRow" hidden><span>Discount <small id="discCode"></small></span><span id="disc" style="color:var(--pink)"></span></div>
        <form class="coupon" id="couponForm"><input id="code" placeholder="Discount code" aria-label="Discount code"><button class="btn sm" style="border-radius:10px">Apply</button></form>
        <div class="coupon-msg" id="couponMsg"></div>
        <div class="r total"><span>Total (USD)</span><span id="tot">$0.00</span></div>
        <div class="sandbox">Sandbox demo — PayPal test mode, no real money is charged.</div>
        <div id="paypal-button-container"></div>
        <div class="secure"><span id="lockIco" style="width:18px;height:18px;display:inline-flex"></span>Secure checkout · PayPal, Visa, Mastercard, AMEX</div>
      </aside>
    </div>
  </div>
  <div id="thanks" class="thanks" hidden><img src="/img/brand/mascot.png" alt="" style="height:150px;margin:0 auto 10px"><h2>Thank you for your order! 💚</h2><p id="thanksMsg"></p><a class="btn" href="/index.html">Continue shopping</a></div>
</main>
<section class="upsell" id="upsell"><div class="wrap"><h2 style="margin:0 0 16px">Complete the set</h2><div class="grid" id="ups"></div></div><img class="mascot" src="/img/brand/mascot.png" alt=""></section>
<div id="site-footer"></div>
<script src="/js/store.js"></script>
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD&intent=capture"></script>
<script>
renderChrome("cart");
$("#lockIco").innerHTML = ICONS.lock;
let PRODUCTS = [];
let coupon = JSON.parse(localStorage.getItem(COUPON_KEY) || "null");

function render() {
  const t = cartTotals(PRODUCTS, coupon);
  const n = t.lines.reduce((s, l) => s + l.qty, 0);
  $("#nitems").textContent = n ? `${n} item${n > 1 ? "s" : ""}` : "";
  $("#lines").innerHTML = t.lines.length ? t.lines.map(({ p, qty }) => `<div class="line">
      <a class="pic" href="/product.html?id=${p.id}">${p.images?.length ? `<img src="${esc(img(p.images[0]))}" alt="">` : `<div class="ph"><img src="${MASCOT}" alt=""></div>`}</a>
      <div><h3><a href="/product.html?id=${p.id}">${esc(p.name)}</a></h3><div class="price">${money(p.price)}</div>
        <div class="qtybox"><button data-q="${p.id}" data-d="-1" aria-label="Decrease">−</button><input value="${qty}" readonly aria-label="Quantity"><button data-q="${p.id}" data-d="1" aria-label="Increase">+</button></div></div>
      <div style="text-align:right"><div class="price">${money(p.price * qty)}</div><button class="rm" data-rm="${p.id}">Remove</button></div></div>`).join("")
    : '<div class="empty"><p>Your cart is empty.</p><a class="btn" href="/shop.html">Start shopping</a></div>';
  $("#summary").style.display = t.lines.length ? "" : "none";
  $("#sub").textContent = money(t.sub);
  $("#ship").textContent = t.ship ? money(t.ship) : "FREE";
  $("#discRow").hidden = !t.couponOk;
  if (t.couponOk) { $("#disc").textContent = "−" + money(t.discount); $("#discCode").textContent = `(${coupon.code})`; }
  if (coupon && !t.couponOk) showMsg(`${coupon.code} needs a subtotal of at least ${money(coupon.minSubtotal)}.`, "err");
  $("#tot").textContent = money(t.total);
  const left = FREE_SHIP - t.sub;
  $("#shipbar").style.display = t.lines.length ? "" : "none";
  $("#shipbar").innerHTML = left > 0 ? `You're ${money(left)} away from free US shipping!<div class="bar"><i style="width:${Math.min(100, (t.sub / FREE_SHIP) * 100)}%"></i></div>` : "🎉 Free shipping unlocked!";
}
const showMsg = (m, cls) => { $("#couponMsg").textContent = m; $("#couponMsg").className = "coupon-msg " + cls; };
document.addEventListener("click", (e) => {
  const q = e.target.closest("[data-q]"), rm = e.target.closest("[data-rm]");
  if (q) { const it = getCart().find((x) => x.id === q.dataset.q); setQty(q.dataset.q, it.qty + +q.dataset.d); render(); }
  if (rm) { setQty(rm.dataset.rm, 0); render(); }
});
$("#couponForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("#code").value.trim().toUpperCase();
  if (!code) { coupon = null; localStorage.removeItem(COUPON_KEY); showMsg("", ""); return render(); }
  try {
    const r = await fetch("/api/coupons?code=" + encodeURIComponent(code));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Invalid code");
    coupon = j; localStorage.setItem(COUPON_KEY, JSON.stringify(j));
    showMsg(`Code ${j.code} applied: ${j.type === "percent" ? j.value + "% off" : money(j.value) + " off"}${j.minSubtotal ? ` on orders over ${money(j.minSubtotal)}` : ""}.`, "ok");
  } catch (err) { coupon = null; localStorage.removeItem(COUPON_KEY); showMsg(err.message === "Failed to fetch" ? "Could not check the code. Try again." : err.message, "err"); }
  render();
});

loadProducts().then((list) => {
  PRODUCTS = list;
  if (coupon) $("#code").value = coupon.code;
  render();
  const inCart = getCart().map((x) => x.id);
  $("#ups").innerHTML = list.filter((p) => !inCart.includes(p.id)).slice(0, 3).map((p) => `<div class="mini"><a class="pic" href="/product.html?id=${p.id}">${p.images?.length ? `<img src="${esc(img(p.images[0]))}" alt="">` : `<div class="ph"><img src="${MASCOT}" alt=""></div>`}</a>
    <div><h4>${esc(p.name)}</h4><div class="price">${money(p.price)}</div><button class="btn sm" data-add="${p.id}" data-name="${esc(p.name)}" onclick="setTimeout(render,50)">Add to cart</button></div></div>`).join("");
  initPayPal();
});

function initPayPal() {
  if (!window.paypal) { $("#paypal-button-container").textContent = "PayPal could not load. Check your connection."; return; }
  paypal.Buttons({
    style: { shape: "pill", color: "gold", layout: "vertical" },
    createOrder: (d, a) => {
      const t = cartTotals(PRODUCTS, coupon);
      if (!t.total) return Promise.reject("Cart empty");
      const breakdown = { item_total: { currency_code: "USD", value: t.sub.toFixed(2) }, shipping: { currency_code: "USD", value: t.ship.toFixed(2) } };
      if (t.discount) breakdown.discount = { currency_code: "USD", value: t.discount.toFixed(2) };
      return a.order.create({ purchase_units: [{ description: "ARROW order", amount: { currency_code: "USD", value: t.total.toFixed(2), breakdown } }] });
    },
    onApprove: async (d, a) => {
      const det = await a.order.capture();
      const t = cartTotals(PRODUCTS, coupon);
      // Record the order for the admin panel. It is NOT sent to CJ automatically —
      // the owner reviews it and clicks "Send to CJ" in /admin.
      const payload = { paypalOrderId: det.id, payer: det.payer, shipping: det.purchase_units?.[0]?.shipping,
        items: getCart().map((x) => ({ id: x.id, qty: x.qty })), coupon: t.couponOk ? coupon.code : null, paidAmount: t.total };
      try { await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); }
      catch (e) { console.error("Could not record order", e); }
      localStorage.removeItem(CART_KEY); localStorage.removeItem(COUPON_KEY); updateCount();
      $("#cartArea").hidden = true; $("#upsell").hidden = true; $("#thanks").hidden = false;
      $("#thanksMsg").textContent = `Order ${det.id} confirmed${det.payer?.name?.given_name ? ", " + det.payer.name.given_name : ""}. You'll receive a tracking email once it ships (3–7 business days).`;
    },
    onError: (e) => { console.error(e); toast("Payment error — please try again"); },
  }).render("#paypal-button-container");
}
</script></body></html>
