<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun finds for kids, home, pets &amp; more | ARROW</title><meta name="description" content="ARROW — fun finds for kids, home, pets & more. Curious everyday picks shipped from US warehouses. Free US shipping on orders over $35.">
<link rel="icon" href="/img/brand/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<div id="site-header"></div>
<section class="carousel" id="hero" aria-roledescription="carousel">
  <div class="slides" id="slides"></div>
  <button class="car-arrow prev" aria-label="Previous slide"></button><button class="car-arrow next" aria-label="Next slide"></button>
  <div class="dots" id="dots"></div>
</section>
<svg class="wave" viewBox="0 0 1200 22" preserveAspectRatio="none"><path d="M0 22V10c40 0 40-10 80-10s40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10 40-10 80-10 40 10 80 10V22z" fill="#faf5ea"/></svg>

<nav class="chips m-only" aria-label="Shop by category">
  <a href="/shop.html?tab=kids">Kids</a><a href="/shop.html?tab=home">Home</a><a href="/shop.html?tab=pets">Pets</a><a href="/shop.html?tab=car">Car</a><a href="/shop.html?tab=geek">Geek &amp; Gamer</a><a href="/shop.html?view=new">✨ New</a>
</nav>
<section class="block trend"><div class="wrap">
  <div class="sec-head"><h2>Trending curiosities</h2><a href="/shop.html?view=bestsellers">Shop bestsellers →</a></div>
  <div class="trend-grid" id="trend"></div>
</div></section>
<section class="block"><div class="wrap">
  <div id="homeTabs"></div>
  <div id="tabbed"><div class="skeleton"></div></div>
</div></section>

<section class="bundle"><div class="wrap">
  <div><h2>Bundle &amp; save 15%</h2><p>Spend $50 or more and save 15% with code <code>BUNDLE15</code></p><a class="btn cream" href="/shop.html?view=bundles">Build your bundle</a></div>
  <img class="mascot" src="/img/brand/mascot.png" alt="ARROW mascot">
</div></section>

<section class="trust"><div class="wrap" id="trust"></div></section>

<div id="site-footer"></div>
<script src="/js/store.js"></script>
<script>
renderChrome("home");
$("#trust").innerHTML = [
  ["lock","Secure PayPal checkout","Pay with PayPal or card"],["ret","30-day returns","Easy, no-fuss returns"],
  ["heart","Fun finds for kids, home, pets & more","Curious, practical picks"],["truck","Fast US delivery","Free over $35"]]
  .map(([i,b,s]) => `<div class="t">${ICONS[i]}<div><b>${b}</b><span>${s}</span></div></div>`).join("");

// ----- carousel (slides come from the admin panel → Banners) -----
(async function () {
  const s = await loadSettings();
  const slides = (s.slides && s.slides.length ? s.slides : []);
  const track = $("#slides"), dots = $("#dots");
  track.innerHTML = slides.map((x, i) => `<div class="slide" style="background-image:url('${esc(img(x.image))}')" role="group" aria-label="Slide ${i + 1} of ${slides.length}">
    <div class="wrap" style="width:100%"><div class="txt"><h1>${esc(x.headline)}</h1><p>${esc(x.subtitle)}</p>${x.buttonText ? `<a class="btn" href="${esc(x.buttonLink || "/shop.html")}">${esc(x.buttonText)}</a>` : ""}</div></div></div>`).join("");
  dots.innerHTML = slides.map((_, i) => `<button aria-label="Go to slide ${i + 1}"></button>`).join("");
  $(".car-arrow.prev").innerHTML = ICONS.left; $(".car-arrow.next").innerHTML = ICONS.right;
  let cur = 0, timer;
  const go = (i) => { cur = (i + slides.length) % slides.length; track.style.transform = `translateX(-${cur * 100}%)`; $$("#dots button").forEach((d, k) => d.classList.toggle("on", k === cur)); };
  const auto = () => { clearInterval(timer); timer = setInterval(() => go(cur + 1), 5500); };
  $(".car-arrow.prev").onclick = () => { go(cur - 1); auto(); };
  $(".car-arrow.next").onclick = () => { go(cur + 1); auto(); };
  $$("#dots button").forEach((d, k) => (d.onclick = () => { go(k); auto(); }));
  $("#hero").addEventListener("mouseenter", () => clearInterval(timer)); $("#hero").addEventListener("mouseleave", auto);
  go(0); if (slides.length > 1) auto();
})();

const startTab = TABS[new URLSearchParams(location.search).get("tab")] ? new URLSearchParams(location.search).get("tab") : "kids";
loadProducts().then((list) => {
  const FEATURED_IDS = ["ice-cream-pen-holder", "mini-pet-hair-remover", "rearview-mirror-phone-mount", "mechanical-hand-stand"];
  const featured = FEATURED_IDS.map((id) => list.find((p) => p.id === id)).filter(Boolean);
  $("#trend").innerHTML = featured.map((p) => productCard(p, { eager: true, className: "feature" })).join("");
  const draw = (tab) => {
    $("#homeTabs").innerHTML = storeTabsHTML(tab, (k) => "/index.html?tab=" + k);
    const html = groupedSectionsHTML(list.filter((p) => tabOf(p) === tab), tab, { limit: 5 });
    $("#tabbed").innerHTML = html || '<div class="empty">No products here yet.</div>';
  };
  draw(startTab);
});
</script></body></html>
