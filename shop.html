<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | ARROW</title><meta name="description" content="ARROW — fun finds for kids and home. Curious everyday picks shipped from US warehouses. Free US shipping on orders over $35.">
<link rel="icon" href="/img/brand/favicon.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<div id="site-header"></div>
<section class="pagehero"><div class="wrap"><h1 id="title">Shop kids &amp; home</h1></div><img class="mascot" src="/img/brand/mascot.png" alt=""></section>
<div class="wrap shop">
  <aside class="filters" id="filters">
    <div class="grp"><h4>Category</h4><div id="catf"></div></div>
    <div class="grp"><h4>Max price: <span id="pv"></span></h4><input type="range" id="price" min="5" max="60" step="1" value="60"></div>
    <div class="grp"><label style="justify-content:space-between"><h4 style="margin:0">On sale</h4><span class="switch"><input type="checkbox" id="sale"><i></i></span></label></div>
    <button class="btn ghost sm" id="reset">Clear filters</button>
  </aside>
  <div>
    <div id="shopTabs"></div>
    <div id="notice"></div>
    <div class="toolbar"><h3 id="count">Loading…</h3>
      <button class="btn ghost filt-btn" id="filtBtn" type="button" aria-controls="filters" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span id="fcount"></span></button>
      <select class="sort" id="sort" aria-label="Sort"><option value="featured">Sort by: Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option><option value="new">Newest</option></select></div>
    <div id="grid" class="shop-groups"></div>
  </div>
</div>
<div id="site-footer"></div>
<script src="/js/store.js"></script>
<script>
const params = new URLSearchParams(location.search);
const view = params.get("view"), q = (params.get("q") || "").toLowerCase();
const catParam = params.get("cat");
let tab = params.get("tab") || (catParam && TAB_OF[catParam]) || (view || q ? "all" : "kids");
if (tab !== "kids" && tab !== "home" && tab !== "all") tab = "kids";
renderChrome({ new: "new", bestsellers: "best", bundles: "bundles", sale: "sale", kids: "kids", home: "home" }[view || (tab === "all" ? "shop" : tab)] || "shop");
const TITLES = { new: "New arrivals", bestsellers: "Bestsellers", bundles: "Bundle & save 15%", sale: "On sale", kids: "Kids", home: "Home" };
if (TITLES[view] || TITLES[tab]) $("#title").textContent = TITLES[view] || TITLES[tab] || "Shop kids & home";
if (q) $("#title").textContent = `Results for “${params.get("q")}”`;
if (view === "bundles") $("#notice").innerHTML = '<div class="notice">🎯 Mix and match any products. Spend $50+ and use code <b>BUNDLE15</b> at checkout to save 15%.</div>';
if (view === "sale") $("#sale").checked = true;

function tabHref(k) {
  const u = new URL(location.href);
  if (k === "all") u.searchParams.delete("tab"); else u.searchParams.set("tab", k);
  if (view) u.searchParams.set("view", view); else u.searchParams.delete("view");
  return u.pathname + "?" + u.searchParams.toString();
}
function drawCatFilters() {
  const entries = tab === "all" ? Object.entries(CATEGORIES) : (TABS[tab]?.cats || []).map((k) => [k, CATEGORIES[k]]);
  $("#catf").innerHTML = entries.map(([k, v]) => `<label><input type="checkbox" value="${k}" ${catParam === k ? "checked" : ""}> ${v}</label>`).join("");
}
drawCatFilters();
$("#shopTabs").innerHTML = `<div class="store-tabs" role="tablist" aria-label="Shop section">
  <a role="tab" class="${tab === "kids" ? "on" : ""}" href="/shop.html?tab=kids${view ? "&view=" + encodeURIComponent(view) : ""}${q ? "&q=" + encodeURIComponent(params.get("q")) : ""}">Kids</a>
  <a role="tab" class="${tab === "home" ? "on" : ""}" href="/shop.html?tab=home${view ? "&view=" + encodeURIComponent(view) : ""}${q ? "&q=" + encodeURIComponent(params.get("q")) : ""}">Home</a>
</div>`;

loadProducts().then((all) => {
  const max = Math.ceil(Math.max(...all.map((p) => p.price), 10));
  $("#price").max = max; $("#price").value = max;
  function apply() {
    const cats = $$("#catf input:checked").map((i) => i.value), pmax = +$("#price").value, sale = $("#sale").checked;
    $("#pv").textContent = money(pmax).replace(".00", "");
    let list = all.filter((p) => (tab === "all" || tabOf(p) === tab) && (!cats.length || cats.includes(p.category)) && p.price <= pmax && (!sale || (p.compareAt && p.compareAt > p.price)));
    if (view === "new") list = list.filter((p) => p.isNew);
    if (view === "bestsellers") list = list.filter((p) => p.bestseller);
    if (q) list = list.filter((p) => (p.name + " " + p.description + " " + (CATEGORIES[p.category] || "") + " " + tabOf(p)).toLowerCase().includes(q));
    const s = $("#sort").value;
    if (s === "low") list.sort((a, b) => a.price - b.price);
    if (s === "high") list.sort((a, b) => b.price - a.price);
    if (s === "name") list.sort((a, b) => a.name.localeCompare(b.name));
    if (s === "new") list.sort((a, b) => (b.isNew - a.isNew));
    const nf = cats.length + (sale ? 1 : 0) + (pmax < max ? 1 : 0);
    $("#fcount").textContent = nf ? ` (${nf})` : "";
    $("#count").textContent = `${list.length} product${list.length === 1 ? "" : "s"}`;
    const grouped = groupedSectionsHTML(list, tab === "all" ? "kids" : tab) + (tab === "all" ? groupedSectionsHTML(list, "home") : "");
    // If sorting by something other than featured, still keep subtitle groups (items already sorted inside each group by the same comparator).
    $("#grid").innerHTML = list.length ? grouped : '<div class="empty" style="grid-column:1/-1">No products match these filters.</div>';
  }
  $$(".filters input, #sort").forEach((el) => el.addEventListener("input", apply));
  $("#catf").addEventListener("input", apply);
  $("#reset").onclick = () => { $$("#catf input").forEach((i) => (i.checked = false)); $("#sale").checked = false; $("#price").value = max; apply(); };
  apply();
  $("#filtBtn").onclick = () => { const o = $("#filters").classList.toggle("open"); $("#filtBtn").setAttribute("aria-expanded", o); };
});
</script></body></html>
